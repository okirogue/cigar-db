name: migrate-uid

# 운영자 UID 이전 (일회성, 수동). 옛 익명 UID 문서를 새 UID 로 옮김. 결과는 통계 이슈에 댓글로.
on:
  workflow_dispatch:
    inputs:
      old:
        description: "옛 UID 앞 6자리"
        required: true
      new:
        description: "새 UID 앞 6자리"
        required: true
      dry:
        description: "true 면 실제로 안 바꾸고 계획만"
        default: "true"

permissions:
  contents: read
  issues: write
  id-token: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Auth to Google Cloud (WIF)
        id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/878079125373/locations/global/workloadIdentityPools/github/providers/github
          service_account: play-publisher@myhumidor-2482d.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
      - name: Migrate
        env:
          TOKEN: ${{ steps.gcp-auth.outputs.access_token }}
          PROJECT: myhumidor-2482d
        run: |
          ARGS="${{ inputs.old }} ${{ inputs.new }}"
          [ "${{ inputs.dry }}" = "true" ] && ARGS="$ARGS --dry"
          python3 .github/scripts/migrate_uid.py $ARGS 2>&1 | tee out.txt
      - name: Comment result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NUM=$(gh issue list --label stats --state open --json number --jq '.[0].number' || true)
          { echo "### migrate-uid (dry=${{ inputs.dry }}) · run ${{ github.run_id }}"; echo '```'; tail -n 80 out.txt; echo '```'; } > body.md
          [ -n "$NUM" ] && gh issue comment "$NUM" --body-file body.md || true
