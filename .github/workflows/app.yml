name: app-build

on:
  push:
    paths:
      - "app/**"
      - ".github/workflows/app.yml"
      - ".github/scripts/**"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  id-token: write # Google Play 업로드용 Workload Identity Federation

concurrency:
  group: app-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      # android/ 폴더가 아직 없으면 생성 (기존 lib/pubspec은 건드리지 않음)
      - name: Scaffold android project if missing
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.okirogue --project-name cigar_log .
            git status --short
          fi

      - name: Pub get
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos 2>&1 | tee ../ci-analyze.txt

      - name: Test
        run: |
          set -o pipefail
          flutter test 2>&1 | tee ../ci-test.txt

      # 플레이 업로드 키 (GitHub Secrets에 있을 때만). 없으면 debug 키로 서명.
      - name: Prepare upload keystore
        if: env.KS != ''
        run: |
          echo "$KS" | base64 -d > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=../upload-keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=upload
          EOF

      - name: Build APK
        run: |
          set -o pipefail
          flutter build apk --release --build-number=${{ github.run_number }} 2>&1 | tee ../ci-build.txt
          cp build/app/outputs/flutter-apk/app-release.apk ../MyHumidor.apk

      # 플레이 스토어용 번들 (업로드 키 있을 때만 의미 있음)
      - name: Build App Bundle (.aab)
        if: env.KS != ''
        run: |
          set -o pipefail
          flutter build appbundle --release --build-number=${{ github.run_number }} 2>&1 | tee -a ../ci-build.txt
          cp build/app/outputs/bundle/release/app-release.aab ../MyHumidor.aab

      - name: Inspect APK icon resources
        run: |
          unzip -l build/app/outputs/flutter-apk/app-release.apk | grep -i 'ic_launcher' || true
          "$ANDROID_HOME"/build-tools/*/aapt dump badging build/app/outputs/flutter-apk/app-release.apk 2>/dev/null | grep -i 'icon\|package:' || true

      - uses: actions/upload-artifact@v4
        with:
          name: cigar_log-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      # 고정 주소로 받을 수 있게 Releases에 등록: .../releases/latest/download/MyHumidor.apk
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep '^version:' app/pubspec.yaml | sed 's/version: *//; s/+.*//')
          TAG="v${VER}-b${{ github.run_number }}"
          FILES="MyHumidor.apk"; [ -f MyHumidor.aab ] && FILES="$FILES MyHumidor.aab"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # 재실행이면 파일만 덮어쓰기
            gh release upload "$TAG" $FILES --clobber
          else
            gh release create "$TAG" $FILES \
              --title "MyHumidor $TAG" \
              --notes "빌드 ${{ github.run_number }} · ${GITHUB_SHA::7} — $(git log -1 --pretty=%s)" \
              --latest
          fi

      # Google Play 내부 테스트 + 비공개 테스트(alpha) 트랙에 자동 업로드 (키 파일 없이 WIF로 인증)
      - name: Auth to Google Cloud (WIF)
        if: github.ref == 'refs/heads/main' && env.KS != ''
        id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/878079125373/locations/global/workloadIdentityPools/github/providers/github
          service_account: play-publisher@myhumidor-2482d.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher

      - name: Upload to Play internal track
        if: github.ref == 'refs/heads/main' && env.KS != ''
        working-directory: .
        env:
          TOKEN: ${{ steps.gcp-auth.outputs.access_token }}
          PKG: com.okirogue.cigar_log
          NOTE: "빌드 ${{ github.run_number }} · ${{ github.sha }}"
        run: python3 .github/scripts/play_upload.py MyHumidor.aab internal alpha 2>&1 | tee ci-play.txt

      # 새로 생성된 android/ 스캐폴드는 저장소에 커밋해 둔다 (권한·매니페스트 편집용)
      - name: Commit scaffold
        run: |
          cd ..
          git add app/android app/.gitignore app/.metadata 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(app): add android scaffold from flutter create"
            git push
          fi

      # 실패 시 로그를 이슈 코멘트로 남김 (로그 blob 저장소가 외부에서 안 열릴 때 대비)
      - name: Post failure log to issue
        if: failure()
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### app-build failed · ${GITHUB_SHA::7} · run ${{ github.run_id }}"
            for f in ci-analyze.txt ci-test.txt ci-build.txt ci-play.txt; do
              if [ -f "$f" ]; then
                echo; echo "<details><summary>$f</summary>"; echo; echo '```'
                grep -vE '^\s*$' "$f" | tail -n 150
                echo '```'; echo '</details>'
              fi
            done
          } > body.md
          NUM=$(gh issue list --label ci-log --state open --json number --jq '.[0].number' || true)
          if [ -z "$NUM" ]; then
            gh label create ci-log --color 777777 --force >/dev/null 2>&1 || true
            NUM=$(gh issue create --title "CI log (app-build)" --label ci-log --body "자동 생성: 빌드 실패 로그가 코멘트로 쌓입니다." | grep -oE '[0-9]+$')
          fi
          gh issue comment "$NUM" --body-file body.md
