name: app-build

on:
  push:
    paths:
      - "app/**"
      - ".github/workflows/app.yml"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: app-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      # android/ 폴더가 아직 없으면 생성 (기존 lib/pubspec은 건드리지 않음)
      - name: Scaffold android project if missing
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.okirogue --project-name cigar_log .
            git status --short
          fi

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos 2>&1 | tee ../ci-analyze.txt

      - name: Test
        run: |
          set -o pipefail
          flutter test 2>&1 | tee ../ci-test.txt

      - name: Build APK (debug-signed release)
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee ../ci-build.txt

      # 실패 시 로그를 이슈 코멘트로 남김 (로그 blob 저장소가 외부에서 안 열릴 때 대비)
      - name: Post failure log to issue
        if: failure()
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### app-build failed · ${GITHUB_SHA::7} · run ${{ github.run_id }}"
            for f in ci-analyze.txt ci-test.txt ci-build.txt; do
              if [ -f "$f" ]; then
                echo; echo "<details><summary>$f</summary>"; echo; echo '```'
                grep -vE '^\s*$' "$f" | tail -n 150
                echo '```'; echo '</details>'
              fi
            done
          } > body.md
          NUM=$(gh issue list --label ci-log --state open --json number --jq '.[0].number' || true)
          if [ -z "$NUM" ]; then
            gh label create ci-log --color 777777 --force >/dev/null 2>&1 || true
            NUM=$(gh issue create --title "CI log (app-build)" --label ci-log --body "자동 생성: 빌드 실패 로그가 코멘트로 쌓입니다." | grep -oE '[0-9]+$')
          fi
          gh issue comment "$NUM" --body-file body.md

      - uses: actions/upload-artifact@v4
        with:
          name: cigar_log-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      # 새로 생성된 android/ 스캐폴드는 저장소에 커밋해 둔다 (권한·매니페스트 편집용)
      - name: Commit scaffold
        run: |
          cd ..
          git add app/android app/.gitignore app/.metadata 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(app): add android scaffold from flutter create"
            git push
          fi
