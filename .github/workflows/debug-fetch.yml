name: debug-fetch

# 수집기 설정용: 사이트맵/페이지를 받아 debug-fetch 브랜치의 debug/ 에 저장 (main 안 건드림)
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "URL(s), space-separated"
        required: true

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch
        run: |
          set +e
          mkdir -p debug
          i=0
          for u in ${{ github.event.inputs.urls }}; do
            i=$((i+1))
            name=$(echo "$u" | sed -E 's#https?://##; s#[^A-Za-z0-9._-]+#_#g' | cut -c1-80)
            curl -sSL --max-time 60 -A "Mozilla/5.0 (cigar-db-bot)" "$u" -o "debug/$name" || echo "FAILED $u"
            echo "$u -> debug/$name $(stat -c %s "debug/$name" 2>/dev/null || echo 0) bytes"
          done
          exit 0
      - name: Commit
        run: |
          git config user.name "cigar-db-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B debug-fetch
          git add -f debug
          git commit -m "debug: fetch pages [skip ci]" || true
          git push -f origin debug-fetch
