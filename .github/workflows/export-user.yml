name: export-user

# 운영자용 디버그: users/<uid> 를 앱 백업 JSON 으로 덤프 (메모 제외) → 워크플로 아티팩트
on:
  workflow_dispatch:
    inputs:
      uid:
        description: "UID 앞 6자리"
        default: "sZlitQ"
      pubkey:
        description: "결과 암호화용 RSA 공개키 (PEM, base64 한 줄). 받는 쪽 개인키로만 풀 수 있음"
        required: true
      full:
        description: "메모·장소·페어링까지 포함 (운영자 본인 기록 확인용)"
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        id: gcp-auth
        with:
          workload_identity_provider: projects/878079125373/locations/global/workloadIdentityPools/github/providers/github
          service_account: play-publisher@myhumidor-2482d.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
      - name: Export
        env:
          TOKEN: ${{ steps.gcp-auth.outputs.access_token }}
          PROJECT: myhumidor-2482d
          FULL: ${{ inputs.full }}
        run: python3 .github/scripts/export_user.py "${{ inputs.uid }}" backup.json
      - name: Encrypt + push to branch debug-export
        env:
          PUB: ${{ inputs.pubkey }}
        run: |
          echo "$PUB" | base64 -d > pub.pem
          openssl rand 32 > k.bin
          openssl enc -aes-256-cbc -pbkdf2 -pass file:k.bin -in backup.json -out backup.enc
          openssl pkeyutl -encrypt -pubin -inkey pub.pem -in k.bin -out k.enc
          mkdir -p out && mv backup.enc k.enc out/
          cd out && git init -q && git config user.name cigar-db-bot && git config user.email actions@users.noreply.github.com
          git add -A && git commit -q -m "export ${{ inputs.uid }} (encrypted)" 
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/debug-export
