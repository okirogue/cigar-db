name: cigar_log
description: MyHumidor — 내 휴미더 · 시가 노트
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.3.3
  sqflite_common_ffi_web: ^1.0.0
  path: ^1.9.0
  path_provider: ^2.1.4
  provider: ^6.1.2
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  file_picker: ^10.0.0
  share_plus: ^10.0.2
  firebase_core: ^4.14.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  firebase_ai: ^4.0.0
  image_picker: ^1.1.2
  image: ^4.3.0
  http: ^1.2.2
  package_info_plus: ^8.1.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/cigars.json
    - assets/tags.json
    - assets/brand/play_icon_512.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/brand/icon_full_1024.png"
  adaptive_icon_background: "#F0E7DC"
  adaptive_icon_foreground: "assets/brand/icon_foreground_1024.png"
  min_sdk_android: 21
